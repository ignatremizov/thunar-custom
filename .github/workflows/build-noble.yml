name: Build Thunar for Ubuntu 24.04

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/noble-4.20.10-hardening
    paths:
      - ".github/workflows/build-noble.yml"
      - "patches/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v7

      - name: Build Noble packages
        run: ./scripts/build-noble.sh

      - name: Verify runtime installation on clean Ubuntu 24.04
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/artifacts:/packages:ro" \
            ubuntu:24.04 bash -euc '
              apt-get update
              apt-get install --yes --no-install-recommends \
                /packages/thunar_*.deb \
                /packages/thunar-data_*.deb \
                /packages/libthunarx-3-0_*.deb \
                /packages/libexo-2-0_*.deb \
                /packages/libexo-common_*.deb \
                /packages/exo-utils_*.deb \
                dbus-x11 xvfb xauth xfconf python3 libxfce4panel-2.0-4
              xvfb-run -a dbus-run-session -- thunar --version
              python3 -c "import ctypes, os; ctypes.CDLL(\"/usr/lib/x86_64-linux-gnu/xfce4/panel/plugins/libthunar-tpa.so\", mode=os.RTLD_NOW)"
              dpkg-query -W thunar thunar-data libthunarx-3-0 libexo-2-0 libexo-common exo-utils
            '

      - name: Upload Debian packages and checksums
        uses: actions/upload-artifact@v7
        with:
          name: thunar-4.20.10-noble-ignat1-hardened-amd64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
