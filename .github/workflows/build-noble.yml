name: Build Thunar for Ubuntu 24.04

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-noble.yml"
      - "patches/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v7

      - name: Build Noble packages
        run: ./scripts/build-noble.sh

      - name: Upload Debian packages and checksums
        uses: actions/upload-artifact@v7
        with:
          name: thunar-4.18.8-1build3-ignat1-amd64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
